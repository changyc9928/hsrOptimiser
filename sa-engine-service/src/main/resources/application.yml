spring:
  application:
    name: sa-engine-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        # An optimization is one long-running message; do not trigger a rebalance
        # while a 100+ call search is still in flight.
        max.poll.interval.ms: 900000

server:
  port: 8081

logging:
  level:
    root: INFO
    com.hsrOptimiser.engine: INFO

asagi:
  url: "https://honkai.asagi-game.com"

inventory:
  url: "http://localhost:8080"

simulated-annealing:
  # Starting temperature is a fraction of the first measured team damage, so the
  # schedule scales with account strength.
  initial-temperature-factor: 0.005
  cooling-rate: 0.9
  # Up to 12 epochs x 20 steps = 240 evaluations. Strong starting loadouts stop
  # early; poor or incomplete loadouts keep exploring. Round 6 is the real
  # objective, so speed/energy builds are not mis-ranked by a short simulation.
  epoch: 12
  steps-per-epoch: 20
  search-round: 6
  final-round: 6
  refine-fraction: 0
  # Never stop before this many steps, and stop after this many steps without a
  # meaningful improvement (>0.01% over the best damage).
  min-steps: 120
  patience: 100
  # After the exploratory run converges, restart from the best build and spend one
  # more patience window polishing it at a low temperature.
  polish-temperature-factor: 0.005
