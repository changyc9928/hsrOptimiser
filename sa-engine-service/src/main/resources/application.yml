spring:
  application:
    name: sa-engine-service
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081

logging:
  level:
    root: INFO
    com.hsrOptimiser.engine: TRACE

asagi:
  url: "https://honkai.asagi-game.com"

inventory:
  url: "http://localhost:8080"

simulated-annealing:
  # Starting temperature is a fraction of the first measured team damage, so the
  # acceptance rate behaves the same for low- and high-investment accounts.
  initial-temperature-factor: 0.05
  cooling-rate: 0.9
  # 20 epochs x 40 steps = 800 damage evaluations, roughly 15 minutes against the
  # simulator. Every step is a remote request, so this is a network budget, not a
  # quality knob: raising it just makes the job queue longer for everyone.
  epoch: 20
  steps-per-epoch: 40
